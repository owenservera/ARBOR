name: ARBOR R002 W1-B isolated Host Node24 acceptance

on:
  push:
    branches:
      - work/accel-r002-w1-b-runtime-proof
    paths:
      - scripts/acceleration/live-host-check.mjs
      - scripts/acceleration/live-host-check.test.mjs
      - .github/workflows/acceleration-r002-w1-b.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceleration-r002-w1-b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-host-node24:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Record pinned source and actual runtime
        shell: bash
        run: |
          set -eu
          git rev-parse --verify HEAD
          node --version
          bun --version
          uname -a
          printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install source-declared workspace dependencies without build hooks
        shell: bash
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run one-command live isolated Host acceptance
        if: always()
        shell: bash
        run: |
          set +e
          node scripts/acceleration/live-host-check.mjs > "$RUNNER_TEMP/b-cli.stdout" 2> "$RUNNER_TEMP/b-cli.stderr"
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/b-cli.exit"
          echo "::group::Host CLI stdout"
          cat "$RUNNER_TEMP/b-cli.stdout"
          echo "::endgroup::"
          echo "::group::Host CLI stderr"
          cat "$RUNNER_TEMP/b-cli.stderr"
          echo "::endgroup::"
          printf 'HOST_CLI_EXIT=%s\n' "$status"
          exit "$status"
      - name: Run isolated Host receipt contract tests
        if: always()
        shell: bash
        run: |
          set +e
          node --test scripts/acceleration/live-host-check.test.mjs > "$RUNNER_TEMP/b-contract.stdout" 2> "$RUNNER_TEMP/b-contract.stderr"
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/b-contract.exit"
          cat "$RUNNER_TEMP/b-contract.stdout"
          cat "$RUNNER_TEMP/b-contract.stderr" >&2
          printf 'HOST_CONTRACT_EXIT=%s\n' "$status"
          exit "$status"
      - name: Observe owner-owned product journal and route tests without edits
        if: always()
        shell: bash
        run: |
          set +e
          node --test apps/vivim-host/test/product-journal.test.mjs apps/vivim-host/test/product-routes.test.mjs > "$RUNNER_TEMP/b-product.stdout" 2> "$RUNNER_TEMP/b-product.stderr"
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/b-product.exit"
          cat "$RUNNER_TEMP/b-product.stdout"
          cat "$RUNNER_TEMP/b-product.stderr" >&2
          printf 'HOST_PRODUCT_EXIT=%s\n' "$status"
          exit "$status"
      - name: Retain raw outputs and literal exits for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceleration-r002-w1-b-node24-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/b-*.stdout
            ${{ runner.temp }}/b-*.stderr
            ${{ runner.temp }}/b-*.exit
          if-no-files-found: warn
          retention-days: 14
