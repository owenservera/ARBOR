name: ARBOR HVI native synthetic tooling checks

# This job NEVER resolves real user/donor repositories. Source fixtures used
# by the test suite are invented in-tree Git objects and injected adapters.
on:
  push:
    branches:
      - integrate/p5-hq-version-intelligence-r001
    paths:
      - 'hq/version-intelligence/**'
      - 'hq/catalogue-identity/**'
      - 'hq/lib/mcp.mjs'
      - 'hq/lib/schema.mjs'
      - 'hq/test/arbor-service.test.mjs'
      - 'hq/test/hvi-mcp-tool.test.mjs'
      - 'contracts/hq-version-intelligence/**'
      - 'tests/hq-version-intelligence/**'
      - 'apps/vivim-host/control/hvi-capability.mjs'
      - 'apps/vivim-host/control/hvi-source-grant.mjs'
      - 'apps/vivim-host/control/hvi-native-guide.json'
      - 'apps/vivim-host/test/hvi-capability.test.mjs'
      - 'apps/vivim-host/test/hvi-source-grant.test.mjs'
      - 'packages/tierflow/**/hvi-inspector*'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/hvi-native-synthetic.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'hq/version-intelligence/**'
      - 'hq/catalogue-identity/**'
      - 'hq/lib/mcp.mjs'
      - 'hq/lib/schema.mjs'
      - 'hq/test/arbor-service.test.mjs'
      - 'hq/test/hvi-mcp-tool.test.mjs'
      - 'contracts/hq-version-intelligence/**'
      - 'tests/hq-version-intelligence/**'
      - 'apps/vivim-host/control/hvi-capability.mjs'
      - 'apps/vivim-host/control/hvi-source-grant.mjs'
      - 'apps/vivim-host/control/hvi-native-guide.json'
      - 'apps/vivim-host/test/hvi-capability.test.mjs'
      - 'apps/vivim-host/test/hvi-source-grant.test.mjs'
      - 'packages/tierflow/**/hvi-inspector*'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/hvi-native-synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hvi-synthetic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-only-synthetic:
    name: Node24 HVI synthetic fixtures (no actual donor scans)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      HVI_NO_REAL_CORPUS: '1'
    steps:
      - name: Checkout approved candidate source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          git rev-parse HEAD
      - name: Install pinned schema validator for HVI test package
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests/hq-version-intelligence --ignore-scripts --no-audit --no-fund --no-save --package-lock=false ajv@8.17.1
      - name: HVI G1/G2 and negative schema suites - invented fixtures only
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/hq-version-intelligence/g1-v2-schema.test.mjs \
            tests/hq-version-intelligence/git-edge-negative-gates.test.mjs \
            tests/hq-version-intelligence/hvi-contract-qa.test.mjs \
            tests/hq-version-intelligence/integrated-nway.test.mjs \
            tests/hq-version-intelligence/schema-negative-gates.test.mjs \
            tests/hq-version-intelligence/g2-host-ui.test.mjs
      - name: Host native read port (synthetic denied/revoked)
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/vivim-host/test/hvi-capability.test.mjs
      - name: Host development-source grant (revocable, expiring, fail closed)
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/vivim-host/test/hvi-source-grant.test.mjs
      - name: Native HQ capability discovery and invocation (synthetic MCP tool)
        shell: bash
        run: |
          set -euo pipefail
          cd hq
          node --test test/hvi-mcp-tool.test.mjs
      - name: Existing HQ boundary suite
        shell: bash
        run: |
          set -euo pipefail
          cd hq
          node --test test/arbor-service.test.mjs test/arbor-boundary.test.mjs test/in-repo-closure.test.mjs
      - name: TierFlow inert inspector (no publisher effects)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test packages/tierflow/tests/hvi-inspector.test.mjs

  # Canonical fail-closed test gate: scripts/test-gate.mjs over the committed
  # manifest scripts/test-manifest.json.
  #
  # Contract:
  #   - the HVI gates are named explicitly and each one forces a full run of
  #     that gate, so CI never skips a test because a change looked unrelated.
  #   - --no-cache disables both cache reads and cache writes, so CI never
  #     reuses a proof instead of running the test.
  #   - --plan publishes the exact selection that was run.
  #   - receipts are written to the canonical HVI proof folder and uploaded.
  #
  # The gate runs the HVI surface only. The wider manifest suite still carries
  # pre-existing failures that also reproduce on origin/main, so it is an
  # operator-level gate, not a CI gate, until those are repaired.
  #
  # Safety: the gate runs synthetic / in-tree fixtures only. It never resolves
  # a real user or donor repository, never calls a provider API, never drives a
  # browser and never reads a personal corpus. CI=true and HVI_NO_REAL_CORPUS=1
  # stay pinned in the job env so that contract is explicit.
  test-gate:
    name: Canonical test gate (HVI gates + receipts)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      HVI_NO_REAL_CORPUS: '1'
    steps:
      - name: Checkout approved candidate source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Bun 1.4.4 (test gate runtime)
        uses: actions/setup-bun@v1
        with:
          bun-version: '1.4.4'
      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          bun --version
          git rev-parse HEAD
      - name: Install pinned schema validator for HVI test package
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix tests/hq-version-intelligence --ignore-scripts --no-audit --no-fund --no-save --package-lock=false ajv@8.17.1
      - name: Publish test gate selection plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .integration/proposal5/hq-version-intelligence/proofs/G2
          bun scripts/test-gate.mjs --plan \
            --gate hvi-g1-g2 --gate hvi-host-read-port --gate hvi-discovery \
            --gate hvi-hq-boundary --gate hvi-tierflow-inspector --gate hvi-modules \
            | tee .integration/proposal5/hq-version-intelligence/proofs/G2/test-gate-plan.txt
      - name: Run canonical test gate (HVI gates, no cache, fail closed)
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/test-gate.mjs --no-cache \
            --gate hvi-g1-g2 --gate hvi-host-read-port --gate hvi-discovery \
            --gate hvi-hq-boundary --gate hvi-tierflow-inspector --gate hvi-modules
      - name: Upload test gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hvi-test-gate-receipts
          path: |
            .integration/proposal5/hq-version-intelligence/proofs/G2/
          if-no-files-found: warn
          retention-days: 30

# Passing this CI workflow proves ONLY synthetic-source checks. G1/G2 still
# require independent review and live canonical Host grant/publisher gates.
