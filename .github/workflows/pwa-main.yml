name: PWA-first main smoke checks
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile-relay/**'
      - 'apps/vivim-host/**'
      - '.github/workflows/pwa-main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pwa-source-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Runtime identity and source syntax
        run: |
          node --version
          node --check apps/vivim-host/server.mjs
          node --check apps/vivim-host/direct-phone.mjs
          node --check apps/mobile-relay/app.js
          node --check apps/mobile-relay/control-client.mjs
          node --check apps/mobile-relay/build-canvas.mjs
          node --check apps/mobile-relay/build-composer.mjs
          node --check apps/mobile-relay/vec/compiler.mjs
          node --check apps/mobile-relay/vec/ui-adapter.mjs
          node --check apps/mobile-relay/sw.js
          node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('apps/mobile-relay/manifest.webmanifest','utf8')); if(m.start_url!=='./'||m.scope!=='./')process.exit(1)"
      - name: PWA UI, VEC and offline shell unit tests
        run: |
          node --test apps/mobile-relay/test/ux-surfaces.test.mjs apps/mobile-relay/test/vec-ui-compiler.test.mjs apps/mobile-relay/test/build-vec-routing.test.mjs apps/mobile-relay/test/build-composer.test.mjs apps/mobile-relay/test/service-worker.test.mjs apps/mobile-relay/test/host-static-allowlist-contract.test.mjs
      - name: Host PWA/auth routing and desktop session contracts
        run: |
          node --test apps/vivim-host/test/mobile-first-entry.test.mjs apps/vivim-host/test/control-browser-session.test.mjs apps/vivim-host/test/control-http.test.mjs
