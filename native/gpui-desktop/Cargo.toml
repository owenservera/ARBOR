[package]
name = "vivim-gpui-desktop"
version = "0.1.0"
edition = "2024"
publish = false

# Keep the experimental GPU dependency graph outside the production workspace lock.
[workspace]

[features]
default = []
desktop = ["dep:gpui", "dep:gpui-component"]

[dependencies]
serde_json = "1"
vivim-host-supervisor = { path = "../host-supervisor" }
sha2 = "0.10"
vivim-programmability-core = { path = "../../core/programmability" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
gpui = { version = "=0.2.2", optional = true }
gpui-component = { version = "=0.5.0", optional = true }

[[bin]]
name = "vivim-gpui-desktop"
path = "src/main.rs"
required-features = ["desktop"]
