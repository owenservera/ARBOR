[package]
name = "vivim-private-shares"
version = "0.1.0"
edition = "2021"
publish = false
description = "Host-owned secure Direct file share storage, policies and lifecycle"

[[bin]]
name = "vivim-private-shares"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
scrypt = "0.11"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs2 = "0.4"
subtle = "2.6"
