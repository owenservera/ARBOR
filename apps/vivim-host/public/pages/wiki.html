<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIVIM — realtime wiki</title>
<link rel="stylesheet" href="/wiki.css">
</head>
<body>
<header>
  <h1>VIVIM realtime wiki</h1>
  <a href="/chat">chat</a>
  <a href="/demo">dev panel</a>
  <span class="rev" id="rev"></span>
</header>
<main id="content"></main>
<form id="edit" class="edit" hidden>
  <h3>Edit <span id="edit-target"></span></h3>
  <textarea id="edit-content"></textarea>
  <div class="actions">
    <button id="edit-save">save</button>
    <button type="button" id="edit-cancel" class="ghost">cancel</button>
  </div>
  <div id="edit-status"></div>
</form>
<script type="module" src="/wiki.js"></script>
</body>
</html>
