[workspace]
resolver = "2"
members = [
  "native/hqkg",
  "native/host-supervisor",
  "native/private-shares",
  "core/programmability",
]
# Tauri is retained only as a legacy reference; it must never poison the
# active Rust workspace dependency resolution or portable WASM builds.
exclude = ["src-tauri", "native/gpui-desktop"]
default-members = [
  "native/hqkg",
  "native/private-shares",
  "core/programmability",
]

[profile.dev]
debug = 0
incremental = false
